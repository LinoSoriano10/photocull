name: CI

# Every branch, not just main. The machine this is developed on has no C
# compiler, so `go test -race` cannot run there at all — CI is the only place a
# data race is ever caught. Restricting that to main meant a feature branch
# could grow for weeks with the one check it most needed never running on it,
# which is exactly what happened to the branch that added documents support.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -cover

  # A published binary is only as trustworthy as what it links. This job is the
  # answer to "is anything in here known to be broken?" — govulncheck matches
  # the module graph and the toolchain against Go's vulnerability database, and
  # reports only what the code actually reaches, so a hit is a real hit.
  # staticcheck catches the class of mistake vet is not looking for.
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

  # The single-binary promise only holds if the whole tree compiles without a C
  # toolchain. This job fails loudly the moment a cgo dependency sneaks in.
  cross-compile:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    strategy:
      matrix:
        target:
          - { goos: windows, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: go build ./cmd/photocull
